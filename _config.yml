# Site settings
title: Feng SiZhe
SEOTitle: Feng SiZhe
header-img: img/post-bg-desk.jpg
email: fengsizhe2002@gmail.com
description: ""
keyword: ""
url: "https://sizheoasis.github.io"
baseurl: ""
github_repo: "https://github.com/SiZheOasis/SiZheOasis.github.io"

# Sidebar settings
sidebar: true

# SNS settings
RSS: false
github_username: SiZheOasis

# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
permalink: pretty
paginate: 10
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md"]
anchorjs: true                          # if you want to customize anchor. check out line:181 of `post.html`

# Gems
# from PR#40, to support local preview for Jekyll 3.0
gems: [jekyll-paginate]

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM                            # use Github Flavored Markdown !important

# Featured Tags
featured-tags: false                    # no posts, so the homepage does not show an empty tag list
featured-condition-size: 1

# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: true
