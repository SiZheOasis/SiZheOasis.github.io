<!DOCTYPE html>
<html lang="{% if page.lang %}{{ page.lang }}{% else %}en{% endif %}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0a">
    <title>{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}</title>
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <link rel="manifest" href="{{ site.baseurl }}/pwa/manifest.json">
    <link rel="stylesheet" href="{{ '/css/front.css' | prepend: site.baseurl }}">
</head>
<body class="{% if page.body_class %}{{ page.body_class }}{% else %}front{% endif %}">
    <div class="shell">
        <header class="top">
            {%- if page.section == "notes" %}
            <a href="{{ '/' | prepend: site.baseurl }}">Feng SiZhe</a>
            <a href="{{ '/notes/' | prepend: site.baseurl }}"{% if page.nav_current == "notes" %} aria-current="page"{% endif %}>学习笔记</a>
            <a href="{{ '/about/' | prepend: site.baseurl }}">About</a>
            {%- elsif page.title == "About" %}
            <a href="{{ '/' | prepend: site.baseurl }}">Home</a>
            {%- else %}
            <a href="{{ '/notes/' | prepend: site.baseurl }}">学习笔记</a>
            <a href="{{ '/about/' | prepend: site.baseurl }}">About</a>
            {%- endif %}
        </header>
        <main class="stage">
            {{ content }}
        </main>
        <footer class="foot">
            {% if site.email %}
            <a href="mailto:{{ site.email }}">{{ site.email }}</a>
            {% endif %}
            {% if site.github_username %}
            <a href="https://github.com/{{ site.github_username }}">{{ site.github_username }}</a>
            {% endif %}
        </footer>
    </div>
</body>
</html>
